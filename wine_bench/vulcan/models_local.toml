
# ---------------------------------------------------------------- local models served by vLLM on Vulcan (vulcan/generate.sbatch)
# name = folder under ~/scratch/models = results folder.  The server runs on the job's own node, hence 127.0.0.1.
# Reasoning is switched off (or set to the minimum) so that, like the API runs, the reply is one plain code answer.
# The API models in this file are not queried on Vulcan: their keys are not in secrets.toml there.

[[models]]
enabled     = true
name        = "qwen3.8-27b"
provider    = "openai"
base_url    = "http://127.0.0.1:8000/v1"
model       = "qwen3.8-27b"
api_key_env = "LOCAL_API_KEY"
api_key     = "none"
max_tokens  = 8192
timeout_s   = 900
extra       = { chat_template_kwargs = { enable_thinking = false } }

