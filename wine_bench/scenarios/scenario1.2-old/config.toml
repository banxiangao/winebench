# Leakage experiment (cutoff 2024-06-30), group "old": scenario 1.2 on the dataset leak2024_old.  Everything but dataset and out is scenario 1.2; templates is a link.
# Scenario 1.2 - one reply, no repository: name + Microsoft documentation (+ the compile context of the file).
# The original config.toml and templates of this scenario were written on the Mac and never copied to Vulcan (only an
# evaluation stub was: config.toml.pilot-stub).  This file and templates/ were reconstructed on 2026-11-24 from the pilot
# prompts and checked against them: with the pilot dataset (wine500_doc) they reproduce the 464 archived prompts of this
# scenario byte for byte (1.1: 463 of 464 - record 0344 differs by one blank line inside a struct of the compile context).
# Dataset since 2026-11-24: winebench205_doc (Wine 11.19).

[paths]                               # relative to this file
dataset = "../../dataset/leak2024_old"
out     = "../../runs/scenario1.2-old"
models  = "../models.toml"
secrets = "../../secrets.toml"

[run]
workers       = 32
max_retries   = 3
timeout_s     = 900
temperature   = 0.0
max_tokens    = 0
skip_existing = true

[stage.programmer]
reply_format    = "code"
system_template = "templates/system.txt"
user_template   = "templates/user.txt"

[stage.programmer.inputs]
none_text            = "None."
show_internal_name   = true           # {{extra_lines}} (1.1 only): "Also exported by", "Implemented in ... under the internal name"
show_all_exporters   = true
show_signature       = false
show_file_includes   = true
show_shared_helpers  = true           # signatures only
shared_helpers_show_code = false
show_same_file_defs  = true
show_docs            = true
docs_strip_sections  = ["-see-also"]
