# ---- GLM / 智谱   (https://docs.bigmodel.cn/cn/guide/start/model-overview  pricing: https://docs.bigmodel.cn/cn/guide/start/pricing)
# The GLM-5.3 line (glm-5.3-flash ¥0.8/¥2.8, glm-5.3-flashx ¥2/¥7, glm-5.3 ¥8/¥28) always thinks: the API rejects
# thinking.type = "disabled".  The GLM-4.7 line accepts it, so the no-thinking run uses glm-4.7-flashx (¥0.5 / ¥3).
[[models]]
enabled     = true
name        = "glm-4-7-flashx"
provider    = "openai"
base_url    = "https://open.bigmodel.cn/api/paas/v4"
model       = "glm-4.7-flashx"                  # cheapest GLM whose thinking can be switched off (glm-4.7-flash is free but rate-limited)
api_key_env = "ZHIPU_API_KEY"
extra       = { thinking = { type = "disabled" } }

[[models]]
enabled     = false                             # thinking cannot be switched off -> not part of the no-thinking comparison
name        = "glm-5-3-flash"
provider    = "openai"
base_url    = "https://open.bigmodel.cn/api/paas/v4"
model       = "glm-5.3-flash"
api_key_env = "ZHIPU_API_KEY"

[[models]]
enabled     = false                             # thinking cannot be switched off
name        = "glm-5-3-flashx"
provider    = "openai"
base_url    = "https://open.bigmodel.cn/api/paas/v4"
model       = "glm-5.3-flashx"
api_key_env = "ZHIPU_API_KEY"

[[models]]
enabled     = false
name        = "glm-5-3"
provider    = "openai"
base_url    = "https://open.bigmodel.cn/api/paas/v4"
model       = "glm-5.3"                         # flagship
api_key_env = "ZHIPU_API_KEY"

# ---- a local / self-hosted OpenAI-compatible server (vLLM, Ollama, LM Studio ...)
